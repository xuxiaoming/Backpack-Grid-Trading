version: "3.9"

services:
  standx-bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    # 去掉 volumes 挂载，避免文件夹冲突
    restart: always
    command: [
      "--exchange", "standx",
      "--symbol", "BTC-USD",
      "--strategy", "maker_hedge",
      "--hedge-exchange", "backpack",
      "--hedge-symbol", "BTC_USDC",
      "--quantity", "0.0002",
      "--spread", "0.15",
      "--leverage", "2",
      "--interval", "6"
    ]
