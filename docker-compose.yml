version: "3.9"

services:
  standx-bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    # 去掉 volumes 挂载，避免文件夹冲突
    restart: always
    command: [
      "--exchange", "standx",
      "--market-type", "perp",
      "--symbol", "BTC-USD",
      "--strategy", "standard",
      "--spread", "0.10",            # 黄金 10 bps 积分区
      "--quantity", "0.003",         # 单档 0.003 BTC
      "--max-orders", "6",           # 单边 6 档阶梯
      "--inventory-skew", "1.5",     # 强化版偏移响应
      "--max-position", "0.06",      # 最大持仓 0.06
      "--profit-threshold", "0.03",
      "--target-position", "0",
      "--interval", "6",
      "--enable-rebalance",
      "--leverage", "6"
    ]
